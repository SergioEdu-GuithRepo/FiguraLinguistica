<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FiguraLinguística</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif;
        background: #f2f6fa;
        color: #16181d;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111318;
          color: #f3f5f8;
        }
        .card {
          background: #1b1f27 !important;
        }
      }
      .card {
        max-width: 360px;
        background: #ffffff;
        border-radius: 28px;
        padding: 32px 24px;
        box-shadow: 0 12px 32px rgba(22, 24, 29, 0.08);
      }
      .logo {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        background: #e8735a;
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
        color: #fff;
        font-size: 30px;
        font-weight: 800;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        opacity: 0.72;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #e8735a;
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        padding: 13px 24px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">FL</div>
      <h1>FiguraLinguística</h1>
      <p>A iniciar a aplicação nativa… Verifica a ligação ao servidor ou à internet.</p>
      <button onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
